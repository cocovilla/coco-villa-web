<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/logo.png" />

    content="Coco Villa – A private eco-friendly retreat in Unawatuna, Sri Lanka. Book your tropical getaway today." />

  <link rel="preconnect" href="https://accounts.google.com" />

  <!-- Google Fonts via <link> instead of CSS @import (non-render-blocking) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap"
    media="print" onload="this.media='all'" />

  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap" />
  </noscript>

  <!-- Preload hero image (LCP element) -->
  <link rel="preload" as="image" href="/hero.png" />

  <!-- Google Sign-In SDK – async defer (non-blocking) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
